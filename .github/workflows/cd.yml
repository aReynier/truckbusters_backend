name: CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/22-cicd'
  pull_request:

jobs:
  push_registry:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Create .env file
      run: |
        touch .env.prod
        echo "${{secrets.ENV}}" >> .env.prod

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TRUCKBUSTERS_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.api-prod
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/truckbusters-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/truckbusters-backend:${{ github.sha }}

  vps_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: SSh deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_KEY  }}
          script: |
            cd truckbusters_app/truckbusters_backend
            sudo docker compose -f docker-compose.prod.yml up -d
            
      


