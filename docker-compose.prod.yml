services:
  database:
    container_name: truckbusters-database
    image: mongodb/mongodb-community-server:8.2-ubi8
    restart: always
    env_file: .env.prod
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGODB_INITDB_DATABASE={MONGO_INITDB_DATABASE}
    networks:
      - truckbusters-network
    volumes:
      - mongodb:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --eval ''db.adminCommand("ping")'' --quiet']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    container_name: truckbusters-api
    image: ${DOCKERHUB_USERNAME}/truckbusters-backend:latest
    restart: always
    env_file: .env.prod
    depends_on:
      - database
    networks:
      - truckbusters-network
    ports:
      - "3002:3002"

networks:
  truckbusters-network:
    driver: bridge

volumes:
  mongodb:
